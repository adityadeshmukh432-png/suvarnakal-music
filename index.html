<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Music App</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: #fff; font-family: 'Arial', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .top-bar { position: absolute; top: 10px; background: #1a1a1a; padding: 10px 20px; border-radius: 50px; border: 1px solid #ff5722; color: #ff5722; font-weight: bold; }
        .app-container { width: 90%; max-width: 400px; background: #1a1a1a; padding: 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .album-art { width: 200px; height: 200px; background: #ff5722; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 5rem; box-shadow: 0 0 30px rgba(255,87,34,0.3); }
        .song-title { font-size: 1.5rem; margin-bottom: 20px; height: 30px; overflow: hidden; white-space: nowrap; }
        .controls { display: flex; justify-content: center; gap: 30px; }
        .btn { background: #333; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; }
        .btn:active { background: #ff5722; }
    </style>
</head>
<body onclick="startMusic()">

    <div class="top-bar">👨‍💻 Aditya Deshmukh Digital App</div>

    <div class="app-container">
        <div class="album-art">🎵</div>
        <div class="song-title" id="display">स्क्रीनवर क्लिक करा...</div>
        <div class="controls">
            <button class="btn" onclick="prevSong()">⏮️</button>
            <button class="btn" id="playBtn" onclick="togglePlay()">▶️</button>
            <button class="btn" onclick="nextSong()">⏭️</button>
        </div>
    </div>

    <div id="player" style="display:none;"></div>

    <script>
        const songs = [
            { title: "कल हो ना हो", id: "g0eO74UmRVs" }, { title: "सूरज हुआ मद्धम", id: "L0zMGUWEp7I" },
            { title: "कहो ना प्यार है", id: "V6g-x1E2wF8" }, { title: "तुम से ही", id: "mt9xg0H2YgY" },
            { title: "तेरे नाम", id: "wXw-4i79Qp0" }, { title: "तेरा होने लगा हूँ", id: "rTuxUAuJRyY" },
            { title: "पी लूँ", id: "4O2i_Yq3W7M" }, { title: "जिया धडक", id: "wXw-4i79Qp0" },
            { title: "डोला रे डोला", id: "dL-V_mZ7mRk" }, { title: "इन दिनों", id: "9QZ_o3-0V8g" }
        ];
        let currentIndex = 0;
        let player, isPlaying = false;

        function startMusic() {
            if(!isPlaying) togglePlay();
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0', videoId: songs[0].id,
                events: { 'onStateChange': (e) => { if(e.data === 0) nextSong(); } }
            });
        }

        function togglePlay() {
            if(isPlaying) { player.pauseVideo(); isPlaying = false; document.getElementById('playBtn').innerText = "▶️"; }
            else { player.playVideo(); isPlaying = true; document.getElementById('playBtn').innerText = "⏸️"; document.getElementById('display').innerText = songs[currentIndex].title; }
        }

        function nextSong() { currentIndex = (currentIndex + 1) % songs.length; player.loadVideoById(songs[currentIndex].id); player.playVideo(); document.getElementById('display').innerText = songs[currentIndex].title; }
        function prevSong() { currentIndex = (currentIndex - 1 + songs.length) % songs.length; player.loadVideoById(songs[currentIndex].id); player.playVideo(); document.getElementById('display').innerText = songs[currentIndex].title; }
    </script>
</body>
</html>
