<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Spotify Music App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #121212; 
            color: white; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            padding: 15px; 
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .banner { 
            background: #1DB954; /* Spotify Green */
            color: #000;
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            font-weight: bold; 
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }
        
        /* स्पॉटिफाय प्लेयर स्टाईल */
        .player-card {
            position: sticky;
            top: 10px;
            background: #181818;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #1DB954;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 100;
        }
        #spotify-player {
            width: 100%;
            height: 152px;
            border: none;
            border-radius: 12px;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #1DB954;
        }

        /* गाण्यांच्या यादीची स्टाईल */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .song-btn { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%; 
            padding: 14px 16px; 
            background: #212121; 
            color: white; 
            border: 1px solid #333; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .song-btn:hover {
            background: #1DB954;
            color: black;
            border-color: #1DB954;
            font-weight: bold;
        }
        .year-tag {
            background: #1DB954;
            color: black;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .song-btn:hover .year-tag {
            background: black;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner">🎧 आदित्य म्युझिक (Spotify Powered)</div>
        
        <!-- स्पॉटिफायचा मुख्य ऑडिओ प्लेयर -->
        <div class="player-card">
            <iframe id="spotify-player" 
                src="https://open.spotify.com/embed/track/7y9gZ4S259hXkK3o3V05v2?utm_source=generator&theme=0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>

        <h2>📻 २००० ते २०१४ स्पॉटिफाय हिट्स</h2>

        <!-- गाण्यांची यादी (Spotify Track IDs सह) -->
        <div class="song-list">

            <button class="song-btn" onclick="playSpotify('7y9gZ4S259hXkK3o3V05v2')">
                <span>🟢 १. कल हो ना हो</span> <span class="year-tag">2003</span>
            </button>

            <button class="song-btn" onclick="playSpotify('0V2I0Xk0K4MhK5n2M65r2M')">
                <span>🟢 २. तुम ही हो (आशिकी २)</span> <span class="year-tag">2013</span>
            </button>

            <button class="song-btn" onclick="playSpotify('7e9m1j49X0A5z5o540W42E')">
                <span>🟢 ३. तुम से ही (जब वी मेट)</span> <span class="year-tag">2007</span>
            </button>

            <button class="song-btn" onclick="playSpotify('5xTqA11cM8gPq2jK8Q3G4s')">
                <span>🟢 ४. तू जाने ना</span> <span class="year-tag">2009</span>
            </button>

            <button class="song-btn" onclick="playSpotify('17qI46fO3S2b6gB16oX4X1')">
                <span>🟢 ५. कहो ना प्यार है</span> <span class="year-tag">2000</span>
            </button>

            <button class="song-btn" onclick="playSpotify('6q1a1q9X0A5z5o540W42E1')">
                <span>🟢 ६. पी लूं (वन्स अपॉन अ टाइम)</span> <span class="year-tag">2010</span>
            </button>

            <button class="song-btn" onclick="playSpotify('4G8v8N8Xk0K4MhK5n2M65r')">
                <span>🟢 ७. गलियां (एक व्हिलन)</span> <span class="year-tag">2014</span>
            </button>

        </div>
    </div>

    <script>
        function playSpotify(trackId) {
            var player = document.getElementById('spotify-player');
            // स्पॉटिफाय एम्बेड URL अपडेट करा
            player.src = "https://open.spotify.com/embed/track/" + trackId + "?utm_source=generator&theme=0";
        }
    </script>

</body>
</html>
