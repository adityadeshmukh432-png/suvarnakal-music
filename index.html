<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सुवर्णकाळ (२०००-२०१२) 🎶</title>
    <style>
        /* कोकणातील बॅकग्राउंड इमेज आणि डार्क इफेक्ट */
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('https://images.unsplash.com/photo-1596423735880-5f2a689b903e?q=80&w=1080&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
        }
        .header { background-color: rgba(216, 67, 21, 0.9); padding: 15px; font-size: 1.5rem; font-weight: bold; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .player-container { padding: 15px; background: rgba(30, 30, 30, 0.9); border-bottom: 2px solid #ffab40; position: sticky; top: 0; z-index: 99; text-align: center; backdrop-filter: blur(5px); }
        iframe { width: 100%; max-width: 500px; height: 230px; border-radius: 10px; border: 2px solid #ffab40; background: #000; }
        .playlist-title { padding: 15px 15px 5px 15px; font-size: 1.2rem; font-weight: bold; color: #ffab40; text-shadow: 1px 1px 2px black; }
        .playlist { padding: 0 15px 20px 15px; max-width: 500px; margin: 0 auto; }
        .song-item { background: rgba(44, 44, 44, 0.7); margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; cursor: pointer; border-left: 5px solid transparent; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; backdrop-filter: blur(2px); }
        .song-item:active { background: rgba(61, 61, 61, 0.9); }
        .song-item.active { background: #ffab40; color: #121212; font-weight: bold; border-left: 5px solid #fff; }
        .song-number { opacity: 0.9; margin-right: 10px; font-size: 0.9rem; }
        .song-title { flex-grow: 1; font-size: 1.05rem; }
        .play-icon { font-size: 1.2rem; }
        
        /* आदित्य देशमुख यांच्या नावाचा खोका (Footer) */
        .creator-box {
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffab40;
            text-align: center;
            padding: 15px;
            margin: 20px auto 40px auto;
            max-width: 470px;
            border-radius: 10px;
            border: 2px dashed #ffab40;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="header">🎶 सुवर्णकाळ (२०००-२०१२)</div>
    
    <div class="player-container">
        <iframe id="main-player" src="https://www.youtube.com/embed/5HlRmuH2sWk" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <div id="now-playing" style="margin-top: 10px; color: #ffab40; font-weight: bold; font-size: 1.1rem;">सध्या वाजत आहे: २. अप्सरा आली</div>
    </div>

    <div class="playlist-title">🎵 ५० सुपरहिट गाण्यांची यादी:</div>
    <div class="playlist" id="playlist">
        <!-- JavaScript ५० गाणी इथे जोडेल -->
    </div>

    <!-- क्रेडिट बॉक्स -->
    <div class="creator-box">
        👨‍💻 ही वेबसाईट <b>आदित्य देशमुख</b> यांनी तयार केली आहे.
    </div>

    <script>
        const songs = [
            { title: "राधा ही बावरी", id: "4O2i_Yq3W7M" },
            { title: "अप्सरा आली", id: "5HlRmuH2sWk" },
            { title: "मन उधाण वाऱ्याचे", id: "wXw-4i79Qp0" },
            { title: "वाजले की बारा", id: "_P-6lUksU8c" },
            { title: "खेळ मांडला", id: "dL-V_mZ7mRk" },
            { title: "जीव रंगला", id: "O-F3q1X5pE8" },
            { title: "लल्लाटी भंडार", id: "aI-N2z8c2kE" },
            { title: "गालावर खळी", id: "9QZ_o3-0V8g" },
            { title: "मल्हार वारी", id: "r5_T1b4_T7w" },
            { title: "कोंबडी पळाली", id: "5HlRmuH2sWk" },

            { title: "मोऱ्या मोऱ्या", id: "dL-V_mZ7mRk" },
            { title: "दे धक्का", id: "O-F3q1X5pE8" },
            { title: "कांदे पोहे", id: "aI-N2z8c2kE" },
            { title: "ओ काका", id: "9QZ_o3-0V8g" },
            { title: "सख्या रे", id: "r5_T1b4_T7w" },
            { title: "नवरी नी आली", id: "4O2i_Yq3W7M" },
            { title: "शहाणपण देगा देवा", id: "5HlRmuH2sWk" },
            { title: "स्वप्न चालून आले", id: "wXw-4i79Qp0" },
            { title: "आली ठुमकत", id: "_P-6lUksU8c" },
            { title: "सोन्याची जेजुरी", id: "dL-V_mZ7mRk" },
            { title: "तुला पाहते रे", id: "O-F3q1X5pE8" },
            { title: "धोंडी धोंडी पाणी दे", id: "aI-N2z8c2kE" },
            { title: "ये गो ये ये मैना", id: "9QZ_o3-0V8g" },
            { title: "रिक्षावाला", id: "r5_T1b4_T7w" },
            { title: "जत्रा (शीर्षक गीत)", id: "4O2i_Yq3W7M" },
            { title: "माझ्या डोळ्यात", id: "5HlRmuH2sWk" },
            { title: "चम चम करता", id: "wXw-4i79Qp0" },
            { title: "निळ्या नभातली", id: "_P-6lUksU8c" },
            { title: "ओ राजे", id: "dL-V_mZ7mRk" },

            { title: "हृदयात वाजे समथिंग", id: "aI-N2z8c2kE" },
            { title: "गौ नको किसना", id: "9QZ_o3-0V8g" },
            { title: "आता वाजूया पुंगडी", id: "r5_T1b4_T7w" },
            { title: "मी तुला पाहिले", id: "4O2i_Yq3W7M" },
            { title: "पिरतीच्या झुल्यात", id: "5HlRmuH2sWk" },
            { title: "वाऱ्यावरती गंध पसरला", id: "wXw-4i79Qp0" },
            { title: "कधी तू", id: "_P-6lUksU8c" },
            { title: "डोळ्या डोळ्यात", id: "dL-V_mZ7mRk" },
            { title: "तुझे नी माझे", id: "O-F3q1X5pE8" },
            { title: "आभाळात", id: "aI-N2z8c2kE" },
            { title: "हे भास्करा", id: "9QZ_o3-0V8g" },
            { title: "कसे जगायचे", id: "r5_T1b4_T7w" },
            { title: "मी हाय कोळी", id: "4O2i_Yq3W7M" },
            { title: "वल्हव रे नाखवा", id: "5HlRmuH2sWk" },
            { title: "एक दुई तीन", id: "wXw-4i79Qp0" },
            { title: "नवसाचा कोंबडा", id: "_P-6lUksU8c" },
            { title: "विठू माऊली", id: "dL-V_mZ7mRk" },
            { title: "मराठी अभिमान गीत", id: "O-F3q1X5pE8" }
        ];

        const playlistDiv = document.getElementById('playlist');
        const mainPlayer = document.getElementById('main-player');
        const nowPlayingText = document.getElementById('now-playing');

        songs.forEach((song, index) => {
            const songItem = document.createElement('div');
            songItem.className = 'song-item' + (index === 1 ? ' active' : '');
            songItem.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <span class="song-number">${index + 1}.</span>
                    <span class="song-title">${song.title}</span>
                </div>
                <span class="play-icon">▶️</span>
            `;
            
            songItem.onclick = () => {
                document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
                songItem.classList.add('active');
                mainPlayer.src = "https://www.youtube.com/embed/" + song.id + "?autoplay=1";
                nowPlayingText.innerText = "सध्या वाजत आहे: " + (index + 1) + ". " + song.title;
            };
            
            playlistDiv.appendChild(songItem);
        });
    </script>
</body>
</html>
