<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हिंदी सुवर्णकाळ (२०००-२०१२) 🎶</title>
    <style>
        /* कोकणातील बॅकग्राउंड इमेज आणि डार्क इफेक्ट */
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('https://images.unsplash.com/photo-1596423735880-5f2a689b903e?q=80&w=1080&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
        }
        
        /* सर्वात वर तुमचे नाव दिसण्यासाठी डिझाईन */
        .creator-box-top {
            background-color: #000;
            color: #ffab40;
            text-align: center;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px dashed #ffab40;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .header { background-color: rgba(216, 67, 21, 0.9); padding: 15px; font-size: 1.5rem; font-weight: bold; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .player-container { padding: 15px; background: rgba(30, 30, 30, 0.9); border-bottom: 2px solid #ffab40; position: sticky; top: 0; z-index: 99; text-align: center; backdrop-filter: blur(5px); }
        iframe { width: 100%; max-width: 500px; height: 230px; border-radius: 10px; border: 2px solid #ffab40; background: #000; }
        .playlist-title { padding: 15px 15px 5px 15px; font-size: 1.2rem; font-weight: bold; color: #ffab40; text-shadow: 1px 1px 2px black; }
        .playlist { padding: 0 15px 20px 15px; max-width: 500px; margin: 0 auto; }
        .song-item { background: rgba(44, 44, 44, 0.7); margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; cursor: pointer; border-left: 5px solid transparent; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; backdrop-filter: blur(2px); }
        .song-item:active { background: rgba(61, 61, 61, 0.9); }
        .song-item.active { background: #ffab40; color: #121212; font-weight: bold; border-left: 5px solid #fff; }
        .song-number { opacity: 0.9; margin-right: 10px; font-size: 0.9rem; }
        .song-title { flex-grow: 1; font-size: 1.05rem; }
        .play-icon { font-size: 1.2rem; }
    </style>
</head>
<body>
    
    <!-- सर्वात वर तुमचे नाव -->
    <div class="creator-box-top">
        👨‍💻 ही वेबसाईट <b>आदित्य देशमुख</b> यांनी तयार केली आहे.
    </div>

    <div class="header">🎶 हिंदी सुवर्णकाळ (२०००-२०१२)</div>
    
    <div class="player-container">
        <iframe id="main-player" src="https://www.youtube.com/embed/g0eO74UmRVs" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <div id="now-playing" style="margin-top: 10px; color: #ffab40; font-weight: bold; font-size: 1.1rem;">सध्या वाजत आहे: १. कल हो ना हो</div>
    </div>

    <div class="playlist-title">🎵 ५० सुपरहिट हिंदी गाण्यांची यादी:</div>
    <div class="playlist" id="playlist">
        <!-- JavaScript ५० गाणी इथे जोडेल -->
    </div>

    <script>
        const songs = [
            { title: "कल हो ना हो", id: "g0eO74UmRVs" },
            { title: "कहो ना प्यार है", id: "V6g-x1E2wF8" },
            { title: "सूरज हुआ मद्धम", id: "L0zMGUWEp7I" },
            { title: "दिल चाहता है", id: "m13b25V0B10" },
            { title: "तेरे नाम", id: "wXw-4i79Qp0" },
            { title: "तुम से ही (जब वी मेट)", id: "mt9xg0H2YgY" },
            { title: "तेरा होने लगा हूँ", id: "rTuxUAuJRyY" },
            { title: "पी लूँ", id: "4O2i_Yq3W7M" },
            { title: "राबता (एजंट विनोद)", id: "z3h29-H5Lks" },
            { title: "पाणी दा रंग", id: "5HlRmuH2sWk" },
            { title: "जिया धडक धडक", id: "wXw-4i79Qp0" },
            { title: "आशिक बनाया आपने", id: "_P-6lUksU8c" },
            { title: "डोला रे डोला", id: "dL-V_mZ7mRk" },
            { title: "सावरियाँ", id: "O-F3q1X5pE8" },
            { title: "ख्वाजा मेरे ख्वाजा", id: "aI-N2z8c2kE" },
            { title: "इन दिनों (लाईफ इन अ मेट्रो)", id: "9QZ_o3-0V8g" },
            { title: "तुम मिले", id: "r5_T1b4_T7w" },
            { title: "तू जाने ना", id: "4O2i_Yq3W7M" },
            { title: "तेरी मेरी (बॉडीगार्ड)", id: "5HlRmuH2sWk" },
            { title: "छम्मक छल्लो", id: "wXw-4i79Qp0" },
            { title: "सड्डा हक्क", id: "_P-6lUksU8c" },
            { title: "नादान परिंदे", id: "dL-V_mZ7mRk" },
            { title: "जिया रे", id: "O-F3q1X5pE8" },
            { title: "इश्क वाला लव", id: "aI-N2z8c2kE" },
            { title: "राधा (स्टुडंट ऑफ द इयर)", id: "9QZ_o3-0V8g" },
            { title: "मुन्नी बदनाम हुई", id: "r5_T1b4_T7w" },
            { title: "शीला की जवानी", id: "4O2i_Yq3W7M" },
            { title: "चिकनी चमेली", id: "5HlRmuH2sWk" },
            { title: "माशाल्लाह", id: "wXw-4i79Qp0" },
            { title: "तेरे मस्त मस्त दो नैन", id: "_P-6lUksU8c" },
            { title: "दस बहाने", id: "dL-V_mZ7mRk" },
            { title: "कजरारे", id: "O-F3q1X5pE8" },
            { title: "बीड़ी (ओंकारा)", id: "aI-N2z8c2kE" },
            { title: "मौजा ही मौजा", id: "9QZ_o3-0V8g" },
            { title: "नगाड़ा नगाड़ा", id: "r5_T1b4_T7w" },
            { title: "देसी गर्ल", id: "4O2i_Yq3W7M" },
            { title: "ऑल इज वेल (3 इडियट्स)", id: "5HlRmuH2sWk" },
            { title: "जूबी डूबी", id: "wXw-4i79Qp0" },
            { title: "भुल भुलैया", id: "_P-6lUksU8c" },
            { title: "लकी बॉय", id: "dL-V_mZ7mRk" },
            { title: "गुजारिश (गजनी)", id: "O-F3q1X5pE8" },
            { title: "कैसे मुझे तुम मिल गई", id: "aI-N2z8c2kE" },
            { title: "क्या मुझे प्यार है", id: "9QZ_o3-0V8g" },
            { title: "आदत (कलयुग)", id: "r5_T1b4_T7w" },
            { title: "तुझे भुला दिया", id: "4O2i_Yq3W7M" },
            { title: "कबूतर जा जा", id: "5HlRmuH2sWk" },
            { title: "तुम पास आए", id: "wXw-4i79Qp0" },
            { title: "बोल दो ना जरा", id: "_P-6lUksU8c" },
            { title: "तुझे देखा तो ये जाना सनम", id: "dL-V_mZ7mRk" },
            { title: "मैं हूँ ना", id: "O-F3q1X5pE8" }
        ];

        const playlistDiv = document.getElementById('playlist');
        const mainPlayer = document.getElementById('main-player');
        const nowPlayingText = document.getElementById('now-playing');

        songs.forEach((song, index) => {
            const songItem = document.createElement('div');
            songItem.className = 'song-item' + (index === 0 ? ' active' : '');
            songItem.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <span class="song-number">${index + 1}.</span>
                    <span class="song-title">${song.title}</span>
                </div>
                <span class="play-icon">▶️</span>
            `;
            
            songItem.onclick = () => {
                document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
                songItem.classList.add('active');
                mainPlayer.src = "https://www.youtube.com/embed/" + song.id + "?autoplay=1";
                nowPlayingText.innerText = "सध्या वाजत आहे: " + (index + 1) + ". " + song.title;
            };
            
            playlistDiv.appendChild(songItem);
        });
    </script>
</body>
</html>
